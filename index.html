<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LeadRescuePro — Voice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #070b14;
    --surface: #0c1220;
    --border: #162240;
    --border-glow: #00d4ff;
    --text: #c8d6e5;
    --text-dim: #4a6a8a;
    --accent: #00d4ff;
    --accent-glow: rgba(0,212,255,0.15);
    --success: #2ed573;
    --warn: #ffa502;
    --error: #ff4757;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background grid */
  .bg-grid {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    animation: gridPulse 8s ease-in-out infinite;
  }
  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: float 12s ease-in-out infinite;
  }
  .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 25%; animation-delay: 2s; width: 2px; height: 2px; }
  .particle:nth-child(3) { left: 40%; animation-delay: 4s; }
  .particle:nth-child(4) { left: 55%; animation-delay: 1s; width: 4px; height: 4px; }
  .particle:nth-child(5) { left: 70%; animation-delay: 3s; width: 2px; }
  .particle:nth-child(6) { left: 85%; animation-delay: 5s; }
  .particle:nth-child(7) { left: 50%; animation-delay: 3.5s; width: 2px; }
  .particle:nth-child(8) { left: 15%; animation-delay: 1.5s; }
  @keyframes float {
    0% { bottom: -10px; opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.4; }
    100% { bottom: 100%; opacity: 0; }
  }
  
  .container {
    position: relative;
    z-index: 1;
    max-width: 440px;
    width: 100%;
    padding: 24px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header with glow */
  .header {
    margin-bottom: 28px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    border-radius: 2px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .sub {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 300;
  }

  /* Status indicator */
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .status-ring {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    transition: all 0.3s;
  }
  .status-ring.listening {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
    animation: ringPulse 1s ease-in-out infinite;
  }
  .status-ring.processing {
    border-color: var(--warn);
    box-shadow: 0 0 12px rgba(255,165,2,0.2);
    animation: ringPulse 0.6s ease-in-out infinite;
  }
  .status-ring.speaking {
    border-color: var(--success);
    box-shadow: 0 0 12px rgba(46,213,115,0.2);
    animation: ringPulse 0.8s ease-in-out infinite;
  }
  .status-ring.idle { border-color: var(--text-dim); box-shadow: none; animation: none; }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* Main mic button */
  .mic-wrap {
    position: relative;
    margin: 8px auto 20px;
  }
  .mic-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  .mic-glow.active { opacity: 1; animation: glowPulse 2s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
  }

  .mic-button {
    position: relative;
    z-index: 2;
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: linear-gradient(145deg, #0c1426, #080e1c);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .mic-button:hover { border-color: #1a3050; }
  .mic-button:active { transform: scale(0.97); }
  
  .mic-button.active {
    border-color: var(--accent);
    box-shadow: 0 0 40px var(--accent-glow), inset 0 0 20px rgba(0,212,255,0.05);
    animation: micBreathe 1.5s ease-in-out infinite;
  }
  .mic-button.processing {
    border-color: var(--warn);
    box-shadow: 0 0 30px rgba(255,165,2,0.15);
  }
  .mic-button.speaking {
    border-color: var(--success);
    box-shadow: 0 0 30px rgba(46,213,115,0.15);
  }

  @keyframes micBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .mic-button svg {
    width: 50px; height: 50px;
    fill: var(--text-dim);
    transition: fill 0.3s;
  }
  .mic-button.active svg { fill: var(--accent); }
  .mic-button.processing svg { fill: var(--warn); }
  .mic-button.speaking svg { fill: var(--success); }

  /* Waveform visualization */
  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 30px;
    margin-bottom: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .waveform .bar {
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
    transform-origin: center;
  }
  .waveform .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .waveform .bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
  .waveform .bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
  .waveform .bar:nth-child(4) { height: 22px; animation-delay: 0.3s; }
  .waveform .bar:nth-child(5) { height: 16px; animation-delay: 0.4s; }
  .waveform .bar:nth-child(6) { height: 24px; animation-delay: 0.5s; }
  .waveform .bar:nth-child(7) { height: 18px; animation-delay: 0.6s; }
  .waveform .bar:nth-child(8) { height: 26px; animation-delay: 0.7s; }
  .waveform .bar:nth-child(9) { height: 14px; animation-delay: 0.8s; }
  .waveform .bar:nth-child(10) { height: 20px; animation-delay: 0.9s; }
  .waveform .bar:nth-child(11) { height: 10px; animation-delay: 1s; }
  
  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); opacity: 0.3; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Chat messages */
  .chat {
    width: 100%;
    max-height: 320px;
    overflow-y: auto;
    margin: 8px 0 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding-right: 4px;
  }
  .chat::-webkit-scrollbar { width: 3px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  
  .msg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    text-align: left;
    animation: msgIn 0.3s ease-out;
    transition: border-color 0.2s;
  }
  .msg:hover { border-color: #1a3050; }
  .msg.user { border-left: 2px solid var(--accent); }
  .msg.hermes { border-left: 2px solid var(--success); }
  
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .msg .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .msg.user .label { color: var(--accent); }
  .msg.hermes .label { color: var(--success); }
  .msg .text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .msg .text.typing::after {
    content: '▊';
    animation: cursorBlink 0.8s step-end infinite;
    color: var(--accent);
  }
  @keyframes cursorBlink {
    50% { opacity: 0; }
  }

  /* Typing indicator */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    width: 100%;
    animation: msgIn 0.3s ease-out;
  }
  .typing-indicator.active { display: flex; }
  .typing-indicator .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); background: var(--text-dim); }
    30% { transform: translateY(-8px); background: var(--accent); }
  }

  /* Text input */
  .input-row {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row input::placeholder { color: var(--text-dim); }
  .input-row button {
    padding: 12px 20px;
    background: linear-gradient(135deg, #00d4ff, #0090cc);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .input-row button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.2); }
  .input-row button:active { transform: scale(0.98); }

  /* Bottom controls */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
    width: 100%;
  }
  .bottom button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .bottom button:hover { border-color: #1a3050; color: var(--text); }
  
  .voice-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }

  /* Password gate */
  .gate {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 20px;
    animation: fadeIn 0.5s ease-out;
  }
  .gate.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .gate h2 {
    font-size: 16px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .gate .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .gate input {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    text-align: center;
    width: 200px;
    outline: none;
    letter-spacing: 8px;
    font-family: 'Inter', sans-serif;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate .error {
    font-size: 12px;
    color: var(--error);
    min-height: 18px;
  }
  .gate button {
    padding: 10px 32px;
    background: linear-gradient(135deg, #00d4ff, #0090cc);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .gate button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.2); }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div>
</div>

<!-- Password Gate -->
<div class="gate" id="gate">
  <div class="logo">LeadRescuePro</div>
  <h2>Voice Access</h2>
  <input type="password" id="passInput" placeholder="••••" maxlength="10" autocomplete="off">
  <div class="error" id="passError"></div>
  <button onclick="checkPass()">Enter</button>
</div>

<div class="container" id="app" style="display:none;">
  <div class="header">
    <h1>LeadRescuePro</h1>
    <div class="sub">Voice Assistant</div>
  </div>

  <div class="status-row">
    <div class="status-ring idle" id="statusRing"></div>
    <span id="statusLabel">Tap the mic and speak</span>
  </div>

  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <div class="mic-wrap">
    <div class="mic-glow" id="micGlow"></div>
    <button class="mic-button" id="micButton" onclick="toggleMic()">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <div class="chat" id="chat"></div>
  <div class="typing-indicator" id="typing">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="input-row">
    <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendText()">Send</button>
  </div>

  <div class="bottom">
    <button onclick="clearChat()">Clear</button>
    <select class="voice-select" id="voiceSelect"></select>
  </div>
</div>

<script>
// ===== CONFIG =====
const API_BASE = ''; // Same-origin (Cloudflare Pages Function)
const PASSCODE = '4791';

// ===== State =====
let isListening = false;
let isProcessing = false;
let isSpeaking = false;
let recognition = null;
let preferredVoice = '';
let voices = [];
let speechSupported = false;

// ===== DOM =====
const mic = document.getElementById('micButton');
const glow = document.getElementById('micGlow');
const ring = document.getElementById('statusRing');
const label = document.getElementById('statusLabel');
const chat = document.getElementById('chat');
const typing = document.getElementById('typing');
const input = document.getElementById('textInput');
const voiceSelect = document.getElementById('voiceSelect');
const waveform = document.getElementById('waveform');

speechSupported = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;

// ===== Password Gate =====
function checkPass() {
  const val = document.getElementById('passInput').value;
  if (val === PASSCODE) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    document.getElementById('app').style.flexDirection = 'column';
    document.getElementById('app').style.alignItems = 'center';
    init();
  } else {
    document.getElementById('passError').textContent = 'Wrong code. Try again.';
    document.getElementById('passInput').value = '';
  }
}
document.getElementById('passInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPass();
});

// ===== Status =====
function setStatus(state, text) {
  ring.className = 'status-ring';
  if (state !== 'idle') ring.classList.add(state);
  mic.className = 'mic-button';
  if (state !== 'idle') mic.classList.add(state);
  glow.className = 'mic-glow';
  if (state === 'listening') glow.classList.add('active');
  waveform.className = 'waveform';
  if (state === 'listening' || state === 'speaking') waveform.classList.add('active');
  label.textContent = text;
  isListening = state === 'listening';
  isProcessing = state === 'processing';
  isSpeaking = state === 'speaking';
}

// ===== Messages =====
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="label">' + (role === 'user' ? 'You' : 'Hermes') + '</div><div class="text">' + escHtml(text) + '</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function clearChat() { chat.innerHTML = ''; }

// ===== Voice list =====
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = '<option value="">Auto voice</option>';
    voices.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name; o.textContent = v.name;
      voiceSelect.appendChild(o);
    });
  };
  setTimeout(() => speechSynthesis.onvoiceschanged(), 300);
}
voiceSelect.addEventListener('change', function() { preferredVoice = this.value; });

// ===== Speak =====
function speak(text) {
  return new Promise(resolve => {
    if (!text || !speechSynthesis) { setStatus('idle', 'Tap the mic'); resolve(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
    if (preferredVoice) { const f = voices.find(v => v.name === preferredVoice); if (f) u.voice = f; }
    setStatus('speaking', 'Speaking...');
    u.onend = () => { setStatus('idle', 'Tap the mic'); resolve(); };
    u.onerror = () => { setStatus('idle', 'Tap the mic'); resolve(); };
    speechSynthesis.speak(u);
  });
}

// ===== API call =====
async function queryAI(text) {
  setStatus('processing', 'Thinking...');
  typing.classList.add('active');
  try {
    const r = await fetch('https://operational-motorola-metallica-noble.trycloudflare.com/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    return d.response || 'Sorry, no response.';
  } catch(e) {
    return "I'm having trouble reaching my systems. Please try again.";
  } finally {
    typing.classList.remove('active');
  }
}

// ===== Process =====
async function processText(text) {
  addMsg('user', text);
  const response = await queryAI(text);
  addMsg('hermes', response);
  await speak(response);
}

// ===== Send text =====
function sendText() {
  if (isProcessing || isSpeaking) return;
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  processText(t);
}
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendText();
});

// ===== Mic =====
function toggleMic() {
  if (isListening) stopMic();
  else if (!isProcessing && !isSpeaking) startMic();
}
function startMic() {
  if (!speechSupported) {
    setStatus('error', 'Voice not supported, type instead');
    setTimeout(() => setStatus('idle', 'Type your message'), 1500);
    input.focus();
    return;
  }
  try {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = function(e) {
      const text = e.results[0][0].transcript;
      stopMic();
      processText(text);
    };
    recognition.onerror = function(e) {
      if (e.error === 'no-speech') setStatus('idle', 'Tap the mic');
      else { setStatus('error', 'Mic error'); setTimeout(() => setStatus('idle', 'Tap the mic'), 1500); }
    };
    recognition.start();
    setStatus('listening', 'Listening...');
  } catch(e) {
    setStatus('error', 'Could not start mic');
    setTimeout(() => setStatus('idle', 'Type'), 1500);
  }
}
function stopMic() {
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  if (!isProcessing && !isSpeaking) setStatus('idle', 'Tap the mic');
}

// ===== Key =====
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleMic(); }
});

// ===== Init =====
function init() {
  addMsg('hermes', 'Hey Fahim. Voice interface is live. Tap the mic or type something.');
  setTimeout(() => setStatus('idle', 'Tap the mic'), 500);
}
</script>
