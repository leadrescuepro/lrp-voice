<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LeadRescuePro Voice v5</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0e17; color: #c8d6e5;
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.container { max-width: 480px; width: 100%; text-align: center; }
.header { margin-bottom: 32px; }
.header h1 { font-size: 22px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 20px rgba(0,212,255,0.15); letter-spacing: 1px; }
.header p { font-size: 13px; color: #5a7a9a; margin-top: 4px; }

#pinGate {
  background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
  border: 1px solid #1a2a44; border-radius: 16px; padding: 40px 24px;
}
#pinGate .lock-icon { font-size: 48px; margin-bottom: 16px; }
#pinGate h2 { font-size: 18px; color: #00d4ff; margin-bottom: 8px; }
#pinGate p { font-size: 13px; color: #5a7a9a; margin-bottom: 24px; }
.pin-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
.pin-input-group input {
  width: 52px; height: 60px; text-align: center;
  background: #0a0e17; border: 2px solid #1a2a44; border-radius: 8px;
  color: #00d4ff; font-size: 26px; font-weight: 700;
  outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none;
}
.pin-input-group input:focus { border-color: #00d4ff; }
.pin-input-group input.filled { border-color: #2ed573; }
.pin-error { color: #ff4757; font-size: 13px; min-height: 20px; margin-bottom: 4px; }
#pinGate button {
  padding: 14px 48px; background: linear-gradient(135deg, #00d4ff 0%, #0088cc 100%);
  border: none; border-radius: 8px; color: #fff; font-weight: 700;
  font-size: 16px; cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
  -webkit-tap-highlight-color: transparent;
}
#pinGate button:disabled { opacity: 0.3; cursor: not-allowed; }
#pinGate button:active { opacity: 0.7; }

#mainUI { display: none; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.idle { background: #5a7a9a; }
.status-dot.listening { background: #00d4ff; animation: pulse 1.5s infinite; }
.status-dot.processing { background: #ffa502; }
.status-dot.speaking { background: #2ed573; animation: pulse 1.5s infinite; }
.status-dot.error { background: #ff4757; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.icon-btn {
  width: 130px; height: 130px; border-radius: 50%;
  border: 3px solid #1a2a44;
  background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin: 24px auto; transition: all 0.3s ease; position: relative;
  box-shadow: 0 0 30px rgba(0,212,255,0.05);
  -webkit-tap-highlight-color: transparent;
}
.icon-btn svg { width: 52px; height: 52px; fill: #5a7a9a; transition: fill 0.3s; }
.icon-btn.active { border-color: #00d4ff; box-shadow: 0 0 50px rgba(0,212,255,0.25); animation: breathe 1.5s ease-in-out infinite; }
.icon-btn.active svg { fill: #00d4ff; }
.icon-btn.processing { border-color: #ffa502; }
.icon-btn.processing svg { fill: #ffa502; }
.icon-btn.speaking { border-color: #2ed573; box-shadow: 0 0 40px rgba(46,213,115,0.2); }
.icon-btn.speaking svg { fill: #2ed573; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.status-text { font-size: 14px; color: #5a7a9a; margin: 8px 0 24px; min-height: 20px; }
.msg-box {
  background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
  border: 1px solid #1a2a44; border-radius: 12px; padding: 16px;
  margin-bottom: 12px; min-height: 50px; text-align: left;
  font-size: 14px; line-height: 1.6;
}
.msg-box .label { font-size: 11px; color: #5a7a9a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.msg-box .text.you { color: #00d4ff; }
.msg-box .text.hermes { color: #2ed573; }
.conversation { max-height: 320px; overflow-y: auto; margin-bottom: 12px; scrollbar-width: thin; scrollbar-color: #1a2a44 transparent; }
.conversation::-webkit-scrollbar { width: 4px; }
.conversation::-webkit-scrollbar-thumb { background: #1a2a44; border-radius: 2px; }
.controls { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
.controls button {
  padding: 10px 20px; border-radius: 8px; border: 1px solid #1a2a44;
  background: #11192e; color: #5a7a9a; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover { border-color: #2a4a6a; color: #8aabcc; }
.text-row { display: flex; gap: 8px; margin-top: 12px; }
.text-row input {
  flex: 1; padding: 12px 16px; background: #11192e; border: 1px solid #1a2a44;
  border-radius: 8px; color: #c8d6e5; font-size: 14px; outline: none;
}
.text-row input:focus { border-color: #00d4ff; }
.text-row button {
  padding: 12px 24px; background: #1a3a5a; border: 1px solid #2a4a6a;
  border-radius: 8px; color: #00d4ff; font-weight: 600; cursor: pointer;
}
.hint { font-size: 12px; color: #3a4a5a; margin-top: 16px; }
.status-line { font-size: 11px; margin-top: 20px; }
.status-line.online { color: #2ed573; }
.status-line.offline { color: #ff4757; }
.status-line.checking { color: #ffa502; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>LeadRescuePro</h1>
    <p>Voice Assistant</p>
  </div>

  <div id="pinGate">
    <div class="lock-icon">🔒</div>
    <h2>Access Required</h2>
    <p>Enter your 4-digit PIN to continue</p>
    <div class="pin-input-group" id="pinInputs">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" class="pin-digit" data-index="0">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" class="pin-digit" data-index="1">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" class="pin-digit" data-index="2">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" class="pin-digit" data-index="3">
    </div>
    <div class="pin-error" id="pinError"></div>
    <button id="unlockBtn">Unlock</button>
  </div>

  <div id="mainUI">
    <div id="status" class="status-text">
      <span class="status-dot idle" id="statusDot"></span>
      <span id="statusLabel">Ready</span>
    </div>

    <button class="icon-btn" id="micButton">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <div class="conversation" id="conversation"></div>

    <div class="text-row">
      <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off" disabled>
      <button id="sendBtn">Send</button>
    </div>

    <div class="controls">
      <button id="clearBtn">Clear</button>
    </div>

    <div class="hint">Tap the mic and speak, or type below</div>
    <div id="connStatus" class="status-line checking">⬤ Checking backend...</div>
  </div>

  <!-- Hidden audio element for real TTS playback -->
  <audio id="audioPlayer" style="display:none"></audio>
</div>

<script>
// =====================================================
// v5 — REAL TTS AUDIO on backend, no browser speechSynthesis
// =====================================================
// FIX: Browser speechSynthesis.speak() often produces silence
// on mobile (Android Chrome). Instead, the backend uses
// edge-tts to generate real MP3 audio files, returned as
// URLs that the audio element plays. Works on ALL devices.
// =====================================================

(function(){
  "use strict";

  var PIN = '4791';

  // ---- PIN Gate ----
  var pinGate = document.getElementById('pinGate');
  var mainUI = document.getElementById('mainUI');
  var pinError = document.getElementById('pinError');
  var unlockBtn = document.getElementById('unlockBtn');
  var pinInputs = document.querySelectorAll('.pin-digit');

  if (localStorage.getItem('lrp_pin') === 'ok') {
    bootApp();
  } else {
    setupPinGate();
  }

  function getPinVal() {
    var v = '';
    for (var i = 0; i < pinInputs.length; i++) {
      v += pinInputs[i].value || '';
    }
    return v;
  }

  function setupPinGate() {
    for (var i = 0; i < pinInputs.length; i++) {
      pinInputs[i].addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value.length > 1) this.value = this.value.slice(-1);
        if (this.value) {
          this.classList.add('filled');
          var idx = parseInt(this.getAttribute('data-index'));
          if (idx < pinInputs.length - 1) {
            pinInputs[idx + 1].focus();
          } else {
            doUnlock();
          }
        } else {
          this.classList.remove('filled');
        }
      });
      pinInputs[i].addEventListener('keydown', function(e) {
        var idx = parseInt(this.getAttribute('data-index'));
        if (e.key === 'Backspace' && !this.value && idx > 0) {
          pinInputs[idx - 1].focus();
        }
        if (e.key === 'Enter' || e.key === 'Go' || e.key === 'Done') {
          e.preventDefault();
          doUnlock();
        }
      });
    }

    unlockBtn.addEventListener('click', function(e) { e.preventDefault(); doUnlock(); });
    unlockBtn.addEventListener('touchend', function(e) { e.preventDefault(); doUnlock(); });
    setTimeout(function() { pinInputs[0].focus(); }, 300);
  }

  function doUnlock() {
    var val = getPinVal();
    if (val !== PIN) {
      pinError.textContent = 'Wrong PIN. Try 4791.';
      for (var i = 0; i < pinInputs.length; i++) {
        pinInputs[i].value = '';
        pinInputs[i].classList.remove('filled');
      }
      pinInputs[0].focus();
      return;
    }
    localStorage.setItem('lrp_pin', 'ok');
    bootApp();
  }

  // ---- Boot ----
  function bootApp() {
    pinGate.style.display = 'none';
    mainUI.style.display = 'block';
    document.getElementById('textInput').disabled = false;
    setTimeout(function() { document.getElementById('textInput').focus(); }, 200);
    addMsg('assistant', "Hello Fahim! Tap the mic and speak, or type below.");
    setStatus('idle', 'Tap the mic or type');
    checkConn();
  }

  // ---- State ----
  var listening = false, processing = false, speaking = false;
  var recog = null;
  var hasSpeech = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
  var audioPlayer = document.getElementById('audioPlayer');

  // DOM helpers
  function $(id) { return document.getElementById(id); }
  var sd = $('statusDot'), sl = $('statusLabel'), mb = $('micButton');
  var conv = $('conversation'), ti = $('textInput'), cs = $('connStatus');

  // Backend URL — always use tunnel (both direct tunnel and GitHub Pages use it)
  var API_BASE = window.location.origin;
  // If loaded from GitHub Pages, we need to hit the tunnel
  var isCrossOrigin = window.location.hostname.indexOf('github.io') !== -1 ||
                      window.location.hostname.indexOf('pages.dev') !== -1;
  var TUNNEL = 'https://lrp-voice.loca.lt';
  var BASE = isCrossOrigin ? TUNNEL : API_BASE;

  function apiHeaders() {
    return {
      'Content-Type': 'application/json',
      'bypass-tunnel-reminder': 'true'
    };
  }

  function setStatus(s, label) {
    sd.className = 'status-dot ' + s;
    mb.className = 'icon-btn';
    sl.textContent = label;
    listening = (s === 'listening');
    processing = (s === 'processing');
    speaking = (s === 'speaking');
    if (s === 'listening') mb.classList.add('active');
    else if (s === 'processing') mb.classList.add('processing');
    else if (s === 'speaking') mb.classList.add('speaking');
  }

  function escape(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addMsg(role, text) {
    var d = document.createElement('div');
    d.className = 'msg-box';
    var who = (role === 'user') ? 'You' : 'LeadRescuePro';
    var cls = (role === 'user') ? 'you' : 'hermes';
    d.innerHTML = '<div class="label">' + who + '</div><div class="text ' + cls + '">' + escape(text) + '</div>';
    conv.appendChild(d);
    conv.scrollTop = conv.scrollHeight;
  }

  // ---- REAL TTS: backend generates actual audio ----
  function speakReal(text) {
    return new Promise(function(resolve) {
      if (!text) {
        setStatus('idle', 'Tap the mic or type');
        resolve();
        return;
      }
      setStatus('speaking', 'Speaking...');

      var xhr = new XMLHttpRequest();
      xhr.open('POST', BASE + '/api/tts?_=' + Date.now(), true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('bypass-tunnel-reminder', 'true');
      xhr.responseType = 'json';

      xhr.onload = function() {
        if (xhr.status === 200 && xhr.response && xhr.response.audio_url) {
          var audioUrl = (isCrossOrigin ? TUNNEL : '') + xhr.response.audio_url;
          audioPlayer.src = audioUrl;
          audioPlayer.onended = function() {
            setStatus('idle', 'Tap the mic or type');
            resolve();
          };
          audioPlayer.onerror = function() {
            // Fallback: try browser TTS if real audio fails
            setStatus('idle', 'Tap the mic or type');
            resolve();
          };
          audioPlayer.play().catch(function() {
            setStatus('idle', 'Tap the mic or type');
            resolve();
          });
        } else {
          setStatus('idle', 'Tap the mic or type');
          resolve();
        }
      };
      xhr.onerror = function() {
        setStatus('idle', 'Tap the mic or type');
        resolve();
      };
      xhr.send(JSON.stringify({text: text}));
    });
  }

  // ---- Backend check ----
  async function checkConn() {
    cs.className = 'status-line checking';
    cs.textContent = '⬤ Checking...';
    try {
      var r = await fetch(BASE + '/health?_=' + Date.now(), { headers: apiHeaders() });
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') !== -1) {
        var d = await r.json();
        if (d && d.status === 'ok') {
          cs.className = 'status-line online';
          cs.textContent = '⬤ Connected';
          return;
        }
      }
      throw 'not-json';
    } catch(e) {
      cs.className = 'status-line offline';
      cs.textContent = '⬤ Backend offline';
      setTimeout(checkConn, 4000);
    }
  }

  // ---- API call ----
  async function callAPI(text) {
    setStatus('processing', 'Thinking...');
    var url = BASE + '/api/chat?_=' + Date.now();
    var body = JSON.stringify({ message: text, session_id: 'v_' + Date.now() });

    for (var i = 0; i < 3; i++) {
      try {
        var r = await fetch(url, {
          method: 'POST',
          headers: apiHeaders(),
          body: body
        });
        var ct = r.headers.get('content-type') || '';
        if (ct.indexOf('json') === -1) throw 'captcha';
        if (!r.ok) throw 'HTTP ' + r.status;
        var d = await r.json();
        return d.response;
      } catch(e) {
        if (i < 2) {
          await new Promise(function(r) { setTimeout(r, 2000); });
          setStatus('processing', e === 'captcha' ? 'Bypassing captcha...' : 'Retrying...');
        }
      }
    }
    cs.className = 'status-line offline';
    cs.textContent = '⬤ Backend offline';
    return "Backend appears offline. Please try again in a moment.";
  }

  async function processAndSpeak(text) {
    var resp = await callAPI(text);
    addMsg('assistant', resp);
    if (resp.indexOf('offline') !== -1) {
      cs.className = 'status-line offline';
      cs.textContent = '⬤ Backend offline';
      setTimeout(checkConn, 4000);
    } else {
      cs.className = 'status-line online';
      cs.textContent = '⬤ Connected';
      await speakReal(resp);
    }
  }

  // ---- Text input ----
  function sendText() {
    if (processing || speaking) return;
    var t = ti.value.trim();
    if (!t) return;
    ti.value = '';
    addMsg('user', t);
    processAndSpeak(t);
  }

  // ---- Mic ----
  function toggleMic() {
    if (listening) { stopMic(); }
    else if (!processing && !speaking) { startMic(); }
  }

  function startMic() {
    if (!hasSpeech) {
      setStatus('error', 'Voice input not supported');
      setTimeout(function() { setStatus('idle', 'Type instead'); }, 2000);
      ti.focus();
      return;
    }
    try {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recog = new SR();
      recog.continuous = false;
      recog.interimResults = false;
      recog.lang = 'en-US';
      recog.onresult = function(e) {
        var t = e.results[0][0].transcript;
        addMsg('user', t);
        processAndSpeak(t);
      };
      recog.onerror = function(e) {
        if (e.error === 'not-allowed') setStatus('error', 'Mic blocked');
        else if (e.error === 'no-speech') { /* silent */ }
        else setStatus('error', e.error);
        setTimeout(function() {
          if (!processing && !speaking) setStatus('idle', 'Tap mic or type');
        }, 2000);
      };
      recog.onend = function() {
        if (!processing && !speaking) setStatus('idle', 'Tap mic or type');
      };
      recog.start();
      setStatus('listening', 'Listening...');
    } catch(e) {
      setStatus('error', 'Mic error');
      setTimeout(function() { setStatus('idle', 'Type'); }, 2000);
    }
  }

  function stopMic() {
    if (recog) { try { recog.stop(); } catch(e) {} recog = null; }
    if (!processing && !speaking) setStatus('idle', 'Tap mic or type');
  }

  // ---- Event listeners ----
  micButton.addEventListener('click', function(e) { e.preventDefault(); toggleMic(); });
  micButton.addEventListener('touchend', function(e) { e.preventDefault(); toggleMic(); });

  document.getElementById('sendBtn').addEventListener('click', function(e) { e.preventDefault(); sendText(); });
  ti.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendText(); });

  document.getElementById('clearBtn').addEventListener('click', function(e) {
    e.preventDefault();
    conv.innerHTML = '';
    addMsg('assistant', 'Cleared.');
  });

  document.addEventListener('keydown', function(e) {
    if (e.target.tagName !== 'INPUT' && e.code === 'Space') {
      e.preventDefault();
      toggleMic();
    }
  });

  // ---- URL param bypass ----
  (function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('pin') === '4791') {
      localStorage.setItem('lrp_pin', 'ok');
      bootApp();
    }
  })();

})();
</script>
</body>
</html>
