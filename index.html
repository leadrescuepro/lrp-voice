<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LeadRescuePro Voice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0a0e17;color:#c8d6e5;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px
}
.container{max-width:440px;width:100%;margin:auto}

/* PIN Gate */
#pg{
  background:linear-gradient(135deg,#11192e,#0f1629);
  border:1px solid #1a2a44;border-radius:16px;padding:40px 20px
}
#pg .lk{font-size:48px;margin-bottom:12px}
#pg h2{font-size:20px;color:#00d4ff;margin-bottom:6px}
#pg p{font-size:14px;color:#5a7a9a;margin-bottom:24px}
.pg{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.pg input{
  width:56px;height:64px;text-align:center;
  background:#0a0e17;border:2px solid #1a2a44;border-radius:10px;
  color:#00d4ff;font-size:28px;font-weight:700;
  outline:none;caret-color:#00d4ff
}
.pg input:focus{border-color:#00d4ff}
.pg input.f{border-color:#2ed573}
.pe{color:#ff4757;font-size:13px;min-height:20px;margin-bottom:6px}
#pg button{
  width:100%;max-width:240px;padding:14px 0;
  background:linear-gradient(135deg,#00d4ff,#0088cc);
  border:none;border-radius:10px;color:#fff;font-weight:700;
  font-size:16px;cursor:pointer
}
#main{display:none}

/* Status dot */
.st{font-size:14px;color:#5a7a9a;margin:8px 0 16px;min-height:22px;display:flex;align-items:center;justify-content:center;gap:6px}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sd.i{background:#5a7a9a}
.sd.ls{background:#00d4ff;animation:pl 1.5s infinite}
.sd.pr{background:#ffa502}
.sd.sp{background:#2ed573;animation:pl 1.5s infinite}
.sd.er{background:#ff4757}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}

/* Mic button */
.mb{
  width:130px;height:130px;border-radius:50%;margin:16px auto;
  border:3px solid #1a2a44;
  background:linear-gradient(135deg,#11192e,#0f1629);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .3s;position:relative;
  -webkit-tap-highlight-color:transparent
}
.mb svg{width:52px;height:52px;fill:#5a7a9a}
.mb.ac{border-color:#00d4ff;box-shadow:0 0 50px rgba(0,212,255,.25);animation:br 1.5s ease-in-out infinite}
.mb.ac svg{fill:#00d4ff}
.mb.pr{border-color:#ffa502}
.mb.pr svg{fill:#ffa502}
.mb.sp{border-color:#2ed573;box-shadow:0 0 40px rgba(46,213,115,.2)}
.mb.sp svg{fill:#2ed573}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Chat area */
.cv{max-height:320px;overflow-y:auto;margin-bottom:12px}
.cv::-webkit-scrollbar{width:4px}
.cv::-webkit-scrollbar-thumb{background:#1a2a44;border-radius:2px}
.ms{
  background:linear-gradient(135deg,#11192e,#0f1629);
  border:1px solid #1a2a44;border-radius:12px;padding:14px;
  margin-bottom:10px;text-align:left;font-size:14px;line-height:1.6
}
.ms .lb{font-size:11px;color:#5a7a9a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ms .tx.u{color:#00d4ff}
.ms .tx.h{color:#2ed573}

/* Input row */
.tr{display:flex;gap:8px;margin-top:8px}
.tr input{
  flex:1;min-width:0;padding:14px 16px;
  background:#11192e;border:1px solid #1a2a44;border-radius:10px;
  color:#c8d6e5;font-size:16px;outline:none
}
.tr input:focus{border-color:#00d4ff}
.tr button{
  padding:14px 24px;background:#1a3a5a;border:1px solid #2a4a6a;
  border-radius:10px;color:#00d4ff;font-weight:600;font-size:15px;cursor:pointer;
  white-space:nowrap
}
.ht{font-size:12px;color:#3a4a5a;margin-top:12px}
.sl{font-size:11px;margin-top:16px}
.sl.ok{color:#2ed573}
.sl.no{color:#ff4757}
.sl.ch{color:#ffa502}

/* Button row */
.cl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.cl button{
  padding:10px 18px;border-radius:8px;border:1px solid #1a2a44;
  background:#11192e;color:#5a7a9a;font-size:13px;cursor:pointer
}
.cl button.on{border-color:#00d4ff;color:#00d4ff}
.cl button.rt{border-color:#2ed573;color:#2ed573}

audio{display:none}
</style>
</head>
<body>
<div class="container">
  <!-- PIN Gate -->
  <div id="pg">
    <div class="lk">🔒</div>
    <h2>Access Required</h2>
    <p>Enter PIN to continue</p>
    <div class="pg" id="pi">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" class="pd" data-idx="0">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" class="pd" data-idx="1">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" class="pd" data-idx="2">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" class="pd" data-idx="3">
    </div>
    <div class="pe" id="pe"></div>
    <button id="ub">Unlock</button>
  </div>

  <!-- Main UI -->
  <div id="main">
    <div class="st">
      <span class="sd i" id="dot"></span>
      <span id="lbl">Ready</span>
    </div>

    <button class="mb" id="mic">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div class="cl">
      <button id="cb">Clear</button>
      <button id="smartToggle">🧠 Smart</button>
      <button id="rtToggle" class="rt">🔴 Real-Time</button>
    </div>

    <div class="cv" id="cv"></div>

    <div class="tr">
      <input type="text" id="ti" placeholder="Type a message..." autocomplete="off" disabled>
      <button id="sb">Send</button>
    </div>

    <div class="ht" id="modeIndicator">⚡ Browser STT</div>
    <div class="sl" id="cs">⬤ Connecting...</div>
  </div>

  <audio id="ap"></audio>
</div>

<script>
(function(){
"use strict";
var P='4791',pg=document.getElementById('pg'),mu=document.getElementById('main');
var pe=document.getElementById('pe'),ub=document.getElementById('ub');
var pis=document.querySelectorAll('.pd'),cs=document.getElementById('cs');

var params=new URLSearchParams(window.location.search);
if(localStorage.getItem('p')==='ok'||params.get('p')==='4791'){
  localStorage.setItem('p','ok');boot();
}else{setupPin();}

function gv(){
  var v='';
  for(var i=0;i<pis.length;i++)v+=pis[i].value||'';
  return v;
}

function setupPin(){
  for(var i=0;i<pis.length;i++){
    pis[i].addEventListener('input',function(){
      this.value=this.value.replace(/[^0-9]/g,'');
      if(this.value.length>1)this.value=this.value.slice(-1);
      if(this.value){
        this.classList.add('f');
        var idx=parseInt(this.getAttribute('data-idx'));
        if(idx<pis.length-1){pis[idx+1].focus();}
        else{unlock();}
      }else{this.classList.remove('f');}
    });
    pis[i].addEventListener('keydown',function(e){
      var idx=parseInt(this.getAttribute('data-idx'));
      if(e.key==='Backspace'&&!this.value&&idx>0)pis[idx-1].focus();
      if(e.key==='Enter'||e.key==='Go'||e.key==='Done'){e.preventDefault();unlock();}
    });
  }
  ub.addEventListener('click',function(e){e.preventDefault();unlock();});
  ub.addEventListener('touchend',function(e){e.preventDefault();unlock();});
  setTimeout(function(){pis[0].focus();},300);
}

function unlock(){
  if(gv()!==P){
    pe.textContent='Wrong PIN';
    for(var i=0;i<pis.length;i++){pis[i].value='';pis[i].classList.remove('f');}
    pis[0].focus();return;
  }
  localStorage.setItem('p','ok');boot();
}

function boot(){
  pg.style.display='none';mu.style.display='block';
  document.getElementById('ti').disabled=false;
  addMsg('h','Hi! Tap the mic or type.');
  setSt('i','Ready');
  checkB();
}

function $(id){return document.getElementById(id);}
var dot=$('dot'),lbl=$('lbl'),mb=$('mic'),cv=$('cv'),ti=$('ti');
var ls=false,pr=false,sp=false,rc=null;
var hs=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
var ap=document.getElementById('ap');
var xo=window.location.hostname.indexOf('github.io')!==-1||window.location.hostname.indexOf('pages.dev')!==-1;
var B=xo?'https://lrp-voice.loca.lt':window.location.origin;

function hd(){return{'Content-Type':'application/json','bypass-tunnel-reminder':'true'};}

function setSt(s,t){
  dot.className='sd '+s;mb.className='mb';
  lbl.textContent=t;ls=s==='ls';pr=s==='pr';sp=s==='sp';
  if(s==='ls')mb.classList.add('ac');
  else if(s==='pr')mb.classList.add('pr');
  else if(s==='sp')mb.classList.add('sp');
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function addMsg(r,t){
  var d=document.createElement('div');d.className='ms';
  var w=r==='u'?'You':'Assistant';
  var c=r==='u'?'u':'h';
  d.innerHTML='<div class="lb">'+w+'</div><div class="tx '+c+'">'+esc(t)+'</div>';
  cv.appendChild(d);cv.scrollTop=cv.scrollHeight;
}

function spk(t){
  return new Promise(function(r){
    if(!t){setSt('i','Ready');r();return;}
    setSt('sp','Speaking...');
    var x=new XMLHttpRequest();
    x.open('POST',B+'/api/tts?_='+Date.now(),true);
    x.setRequestHeader('Content-Type','application/json');
    x.setRequestHeader('bypass-tunnel-reminder','true');
    x.responseType='json';
    x.onload=function(){
      if(x.status===200&&x.response&&x.response.audio_url){
        var u=window.location.origin+x.response.audio_url;
        ap.src=u;
        ap.onended=function(){setSt('i','Ready');r();};
        ap.onerror=function(){setSt('i','Ready');r();};
        ap.play().catch(function(){setSt('i','Ready');r();});
      }else{setSt('i','Ready');r();}
    };
    x.onerror=function(){setSt('i','Ready');r();};
    x.send(JSON.stringify({text:t}));
  });
}

async function checkB(){
  cs.className='sl ch';cs.textContent='⬤ Connecting...';
  try{
    var r=await fetch(B+'/health?_='+Date.now(),{headers:hd()});
    var ct=r.headers.get('content-type')||'';
    if(ct.indexOf('json')!==-1){
      var d=await r.json();
      if(d&&d.status==='ok'){cs.className='sl ok';cs.textContent='⬤ Connected';return;}
    }
  }catch(e){}
  cs.className='sl no';cs.textContent='⬤ Offline';
  setTimeout(checkB,10000);
}

async function api(t){
  setSt('pr','Thinking...');
  var u=B+'/api/chat?_='+Date.now();
  var b=JSON.stringify({message:t,session_id:'v_'+Date.now()});
  for(var i=0;i<3;i++){
    try{
      var r=await fetch(u,{method:'POST',headers:hd(),body:b});
      var ct=r.headers.get('content-type')||'';
      if(ct.indexOf('json')===-1)throw 'c';
      if(!r.ok)throw 'h'+r.status;
      var d=await r.json();
      cs.className='sl ok';cs.textContent='⬤ Connected';
      return d.response;
    }catch(e){
      if(i<2){await new Promise(function(r){setTimeout(r,2000);});setSt('pr','Retrying...');}
    }
  }
  cs.className='sl no';cs.textContent='⬤ Offline';
  setTimeout(checkB,10000);
  return "Backend offline. Try again.";
}

async function pns(t){
  var r=await api(t);
  addMsg('h',r);
  if(r.indexOf('offline')===-1)await spk(r);
}

function stx(){
  if(pr||sp)return;
  var t=ti.value.trim();if(!t)return;
  ti.value='';addMsg('u',t);pns(t);
}

function tm(){if(ls){sm();}else if(!pr&&!sp){stm();}}

function stm(){
  if(!hs){setSt('er','Voice not supported');setTimeout(function(){setSt('i','Type');},2000);ti.focus();return;}
  try{
    if(window._smartMode){stmSmart();return;}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    rc=new SR();rc.continuous=false;rc.interimResults=false;rc.lang='en-US';
    rc.onresult=function(e){var t=e.results[0][0].transcript;addMsg('u',t);pns(t);};
    rc.onerror=function(e){
      if(e.error==='not-allowed')setSt('er','Mic blocked');
      else if(e.error==='no-speech'){}
      else setSt('er',e.error);
      setTimeout(function(){if(!pr&&!sp)setSt('i','Ready');},2000);
    };
    rc.onend=function(){if(!pr&&!sp)setSt('i','Ready');};
    rc.start();setSt('ls','Listening...');
  }catch(e){setSt('er','Mic error');setTimeout(function(){setSt('i','Type');},2000);}
}

var _mediaRecorder=null,_audioChunks=[],_smartStream=null;
function stmSmart(){
  setSt('ls','Listening...');
  _audioChunks=[];
  try{
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      _smartStream=stream;
      _mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
      _mediaRecorder.ondataavailable=function(e){if(e.data.size>0)_audioChunks.push(e.data);};
      _mediaRecorder.onstop=function(){
        _smartStream.getTracks().forEach(function(t){t.stop();});
        var blob=new Blob(_audioChunks,{type:'audio/webm'});
        setSt('pr','Transcribing...');
        var fd=new FormData();
        fd.append('file',blob,'recording.webm');
        var xhr=new XMLHttpRequest();
        xhr.open('POST',B+'/api/transcribe',true);
        xhr.setRequestHeader('bypass-tunnel-reminder','true');
        xhr.responseType='json';
        xhr.onload=function(){
          if(xhr.status===200&&xhr.response){
            var t=xhr.response.transcript||xhr.response.whisper_raw||'';
            if(t){addMsg('u',t);pns(t);}
            else{setSt('i','Ready');}
          }else{setSt('i','Ready');}
        };
        xhr.onerror=function(){setSt('i','Ready');};
        xhr.send(fd);
      };
      _mediaRecorder.start();
      setTimeout(function(){if(_mediaRecorder&&_mediaRecorder.state==='recording')_mediaRecorder.stop();},10000);
    }).catch(function(){setSt('er','Mic blocked');setTimeout(function(){setSt('i','Type');},2000);});
  }catch(e){setSt('er','Mic error');setTimeout(function(){setSt('i','Type');},2000);}
}

function sm(){
  if(_mediaRecorder&&_mediaRecorder.state==='recording'){_mediaRecorder.stop();_mediaRecorder=null;return;}
  if(rc){try{rc.stop();}catch(e){}rc=null;}if(!pr&&!sp)setSt('i','Ready');
}

// Real-Time hold-to-talk
var _rtRecorder=null,_rtStream=null,_rtChunks=[];
function setupRTHoldToTalk(){
  var mb2=document.getElementById('mic');
  if(!mb2)return;
  mb2.replaceWith(mb2.cloneNode(true));
  var mb3=document.getElementById('mic');
  function startRT(){
    if(!window._rtWs||window._rtWs.readyState!==1){setSt('er','Not connected');return;}
    _rtChunks=[];
    navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:true,noiseSuppression:true}})
    .then(function(s){
      _rtStream=s;
      _rtRecorder=new MediaRecorder(s,{mimeType:'audio/webm;codecs=opus'});
      _rtRecorder.ondataavailable=function(e){if(e.data.size>0)_rtChunks.push(e.data);};
      _rtRecorder.onstop=function(){
        _rtStream.getTracks().forEach(function(t){t.stop();});
        if(_rtChunks.length>0){
          var blob=new Blob(_rtChunks,{type:'audio/webm'});
          var reader=new FileReader();
          reader.onload=function(){
            if(window._rtWs&&window._rtWs.readyState===1){
              window._rtWs.send(JSON.stringify({type:'transcribe',audio:reader.result.split(',')[1],format:'webm'}));
            }
          };
          reader.readAsDataURL(blob);
        }else{setSt('i','Hold to talk');}
      };
      _rtRecorder.start();
      setSt('ls','Listening...');
    }).catch(function(){setSt('er','Mic blocked');setTimeout(function(){setSt('i','Ready');},2000);});
  }
  function stopRT(){
    if(_rtRecorder&&_rtRecorder.state==='recording'){_rtRecorder.stop();_rtRecorder=null;}
  }
  mb3.addEventListener('mousedown',function(e){e.preventDefault();startRT();});
  mb3.addEventListener('mouseup',function(e){e.preventDefault();stopRT();});
  mb3.addEventListener('mouseleave',function(e){if(_rtRecorder&&_rtRecorder.state==='recording')stopRT();});
  mb3.addEventListener('touchstart',function(e){e.preventDefault();startRT();});
  mb3.addEventListener('touchend',function(e){e.preventDefault();stopRT();});
  mb3.addEventListener('touchcancel',function(e){if(_rtRecorder&&_rtRecorder.state==='recording')stopRT();});
  if(window._rtWs){
    window._rtWs.onmessage=function(e){
      try{
        var msg=JSON.parse(e.data);
        if(msg.type==='transcript'){addMsg('u',msg.text);}
        else if(msg.type==='reply'){addMsg('h',msg.text);}
        else if(msg.type==='tts'){
          var ap2=document.getElementById('ap');
          if(ap2){
            ap2.src=window.location.origin+msg.url;
            ap2.onended=function(){setSt('i','Hold to talk');};
            ap2.play().catch(function(){setSt('i','Hold to talk');});
          }else{setSt('i','Hold to talk');}
          setSt('sp','Speaking...');
        }else if(msg.type==='state'){
          if(msg.status==='thinking')setSt('pr','Thinking...');
          else if(msg.status==='done')setSt('i','Hold to talk');
        }
      }catch(e){}
    };
  }
}

// Event listeners
mb.addEventListener('click',function(e){e.preventDefault();tm();});
mb.addEventListener('touchend',function(e){e.preventDefault();tm();});
document.getElementById('sb').addEventListener('click',function(e){e.preventDefault();stx();});
ti.addEventListener('keydown',function(e){if(e.key==='Enter')stx();});
document.getElementById('cb').addEventListener('click',function(e){
  e.preventDefault();cv.innerHTML='';addMsg('h','Cleared.');
});
document.getElementById('smartToggle').addEventListener('click',function(e){
  e.preventDefault();
  window._smartMode=!window._smartMode;
  this.textContent=window._smartMode?'🧠 Smart ON':'🧠 Smart';
  this.className=window._smartMode?'on':'';
  document.getElementById('modeIndicator').textContent=window._smartMode?'🧠 Smart Transcription':'⚡ Browser STT';
});
document.getElementById('rtToggle').addEventListener('click',function(e){
  e.preventDefault();
  window._rtMode=!window._rtMode;
  this.textContent=window._rtMode?'🟢 Real-Time ON':'🔴 Real-Time';
  this.className=window._rtMode?'rt on':'rt';
  if(window._rtMode){
    document.getElementById('modeIndicator').textContent='🔴 Real-Time Voice';
    var wsUrl=window.location.origin.replace('http','ws')+'/v2/ws';
    window._rtWs=new WebSocket(wsUrl);
    window._rtWs.onopen=function(){
      cs.className='sl ok';cs.textContent='⬤ Real-Time';
      addMsg('h','Hi! Hold mic to talk, release when done.');
      setupRTHoldToTalk();
    };
    window._rtWs.onerror=function(){
      addMsg('h','Real-Time unavailable.');
      window._rtMode=false;
      document.getElementById('rtToggle').textContent='🔴 Real-Time';
      document.getElementById('rtToggle').className='rt';
      document.getElementById('modeIndicator').textContent='⚡ Browser STT';
    };
    window._rtWs.onclose=function(){
      if(window._rtMode){
        cs.className='sl no';cs.textContent='⬤ Disconnected';
      }
      window._rtWs=null;
    };
  }else{
    if(window._rtWs){window._rtWs.close();window._rtWs=null;}
    document.getElementById('modeIndicator').textContent='⚡ Browser STT';
    location.reload();
  }
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName!=='INPUT'&&e.code==='Space'){e.preventDefault();tm();}
});
})();
</script>
</body>
</html>
