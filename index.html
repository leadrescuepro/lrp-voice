<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LeadRescuePro Voice v3</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e17;
    color: #c8d6e5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 480px; width: 100%; text-align: center; }
  .header { margin-bottom: 32px; }
  .header h1 {
    font-size: 20px; font-weight: 700; color: #00d4ff;
    text-shadow: 0 0 20px rgba(0,212,255,0.15); letter-spacing: 1px;
  }
  .header p { font-size: 13px; color: #5a7a9a; margin-top: 4px; }

  #pinGate {
    background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
    border: 1px solid #1a2a44; border-radius: 16px;
    padding: 40px 24px;
  }
  #pinGate .lock-icon { font-size: 48px; margin-bottom: 16px; }
  #pinGate h2 { font-size: 18px; color: #00d4ff; margin-bottom: 8px; }
  #pinGate p { font-size: 13px; color: #5a7a9a; margin-bottom: 24px; }
  .pin-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .pin-input-group input {
    width: 48px; height: 56px; text-align: center;
    background: #0a0e17; border: 2px solid #1a2a44; border-radius: 8px;
    color: #00d4ff; font-size: 24px; font-weight: 700;
    outline: none; transition: border-color 0.2s;
  }
  .pin-input-group input:focus { border-color: #00d4ff; }
  .pin-input-group input.filled { border-color: #2ed573; }
  .pin-error { color: #ff4757; font-size: 13px; min-height: 20px; margin-bottom: 4px; }
  #pinGate button {
    padding: 12px 40px; background: linear-gradient(135deg, #00d4ff 0%, #0088cc 100%);
    border: none; border-radius: 8px; color: #fff; font-weight: 700;
    font-size: 15px; cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
  }
  #pinGate button:disabled { opacity: 0.3; cursor: not-allowed; }

  #mainUI { display: none; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  .status-dot.idle { background: #5a7a9a; animation: none; }
  .status-dot.listening { background: #00d4ff; }
  .status-dot.processing { background: #ffa502; }
  .status-dot.speaking { background: #2ed573; }
  .status-dot.error { background: #ff4757; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .mic-button {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid #1a2a44;
    background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    margin: 24px auto; transition: all 0.3s ease; position: relative;
    box-shadow: 0 0 30px rgba(0,212,255,0.05);
  }
  .mic-button svg { width: 48px; height: 48px; fill: #5a7a9a; transition: fill 0.3s; }
  .mic-button.active { border-color: #00d4ff; box-shadow: 0 0 40px rgba(0,212,255,0.2); animation: breathe 1.5s ease-in-out infinite; }
  .mic-button.active svg { fill: #00d4ff; }
  .mic-button.processing { border-color: #ffa502; }
  .mic-button.processing svg { fill: #ffa502; }
  .mic-button.speaking { border-color: #2ed573; box-shadow: 0 0 30px rgba(46,213,115,0.15); }
  .mic-button.speaking svg { fill: #2ed573; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .status-text { font-size: 14px; color: #5a7a9a; margin: 8px 0 24px; min-height: 20px; }
  .transcript-box {
    background: linear-gradient(135deg, #11192e 0%, #0f1629 100%);
    border: 1px solid #1a2a44; border-radius: 12px; padding: 16px;
    margin-bottom: 12px; min-height: 50px; text-align: left;
    font-size: 14px; line-height: 1.6;
  }
  .transcript-box .label { font-size: 11px; color: #5a7a9a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .transcript-box .text.you { color: #00d4ff; }
  .transcript-box .text.hermes { color: #2ed573; }
  .conversation { max-height: 300px; overflow-y: auto; margin-bottom: 12px; scrollbar-width: thin; scrollbar-color: #1a2a44 transparent; }
  .conversation::-webkit-scrollbar { width: 4px; }
  .conversation::-webkit-scrollbar-thumb { background: #1a2a44; border-radius: 2px; }
  .controls { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
  .controls button {
    padding: 10px 20px; border-radius: 8px; border: 1px solid #1a2a44;
    background: #11192e; color: #5a7a9a; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .controls button:hover { border-color: #2a4a6a; color: #8aabcc; }
  .voice-selector { margin-top: 16px; font-size: 12px; color: #5a7a9a; }
  .voice-selector select {
    background: #11192e; border: 1px solid #1a2a44; color: #8aabcc;
    padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-left: 6px;
  }
  .text-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .text-input-row input {
    flex: 1; padding: 12px; background: #11192e; border: 1px solid #1a2a44;
    border-radius: 8px; color: #c8d6e5; font-size: 14px; outline: none;
  }
  .text-input-row input:focus { border-color: #00d4ff; }
  .text-input-row button {
    padding: 12px 20px; background: #1a3a5a; border: 1px solid #2a4a6a;
    border-radius: 8px; color: #00d4ff; font-weight: 600; cursor: pointer;
  }
  .hint { font-size: 12px; color: #3a4a5a; margin-top: 16px; }
  .hint kbd { background: #11192e; border: 1px solid #1a2a44; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .status-line { font-size: 11px; margin-top: 20px; }
  .status-line.online { color: #2ed573; }
  .status-line.offline { color: #ff4757; }
  .status-line.checking { color: #ffa502; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>LeadRescuePro</h1>
    <p>Voice Assistant</p>
  </div>

  <div id="pinGate">
    <div class="lock-icon">🔒</div>
    <h2>Access Required</h2>
    <p>Enter your 4-digit PIN to continue</p>
    <div class="pin-input-group" id="pinInputs">
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" class="pin-digit" data-index="0">
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" class="pin-digit" data-index="1">
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" class="pin-digit" data-index="2">
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" class="pin-digit" data-index="3">
    </div>
    <div class="pin-error" id="pinError"></div>
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
  </div>

  <div id="mainUI">
    <div id="status" class="status-text">
      <span class="status-dot idle" id="statusDot"></span>
      <span id="statusLabel">Ready</span>
    </div>

    <button class="mic-button" id="micButton" onclick="toggleMic()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <div class="conversation" id="conversation"></div>

    <div class="text-input-row">
      <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off" disabled>
      <button onclick="sendText()">Send</button>
    </div>

    <div class="controls">
      <button onclick="clearChat()">Clear</button>
    </div>

    <div class="voice-selector">
      Voice: <select id="voiceSelect"></select>
    </div>

    <div class="hint">Tap mic, press <kbd>Space</kbd>, or type</div>
    <div id="connStatus" class="status-line checking">⬤ Checking backend...</div>
  </div>
</div>

<script>
// v3 — ROOT CAUSE FIX: localtunnel captcha bypass + content-type check
// 
// ROOT CAUSE: loca.lt (localtunnel server) intercepts browser requests from
// unknown/new IPs and shows a "511 Network Authentication Required" captcha
// page. The old code got HTML back instead of JSON, and r.json() would throw.
// 
// FIX: (1) Add 'bypass-tunnel-reminder' header to every fetch, which tells
// localtunnel to skip the captcha. (2) Check Content-Type before parsing JSON.
// (3) If we get HTML (captcha page), show a clear message and auto-retry.

const PIN = '4791';

// Pin input logic
(function() {
  const inputs = document.querySelectorAll('.pin-digit');
  inputs.forEach((el, i, arr) => {
    el.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value) { this.classList.add('filled'); if (arr[i+1]) setTimeout(() => arr[i+1].focus(), 50); }
      else this.classList.remove('filled');
      // Auto-unlock when all 4 digits typed
      if (getPinVal().length === 4) unlock();
    });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !this.value && i > 0) arr[i-1].focus();
      if (e.key === 'Enter') unlock();
    });
  });
  function getPinVal() { return Array.from(inputs).map(e => e.value).join(''); }
  window.getPin = getPinVal;
})();

function unlock() {
  if (window.getPin() !== PIN) {
    document.getElementById('pinError').textContent = 'Wrong PIN';
    document.querySelectorAll('.pin-digit').forEach(e => { e.value = ''; e.classList.remove('filled'); });
    document.querySelector('.pin-digit').focus();
    return;
  }
  localStorage.setItem('lrp_pin', 'ok');
  bootApp();
}
if (localStorage.getItem('lrp_pin') === 'ok') bootApp();

// ===== STATE =====
let listening = false, processing = false, speaking = false;
let recog = null, prefVoice = '', voiceList = [];
const hasSpeech = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
const $ = id => document.getElementById(id);
const mb = $('micButton'), sd = $('statusDot'), sl = $('statusLabel');
const conv = $('conversation'), vs = $('voiceSelect'), ti = $('textInput'), cs = $('connStatus');

// Detect if cross-origin (GitHub Pages) vs same-origin (tunnel)
const TUNNEL_HOST = 'https://lrp-voice.loca.lt';
const CROSS = window.location.hostname.includes('github.io') || window.location.hostname.includes('pages.dev');

// Send bypass-tunnel-reminder on ALL requests so localtunnel
// doesn't intercept with its 511 captcha page.
function apiHeaders() {
  return {
    'Content-Type': 'application/json',
    'bypass-tunnel-reminder': 'true'
  };
}

function bootApp() {
  $('pinGate').style.display = 'none';
  $('mainUI').style.display = 'block';
  ti.disabled = false;
  ti.focus();
  addMsg('assistant', "Hello Fahim! Tap the mic and speak, or type.");
  setTimeout(() => setStatus('idle', 'Tap the mic or type'), 200);
  checkConn();
}

function setStatus(s, label) {
  sd.className = 'status-dot ' + s;
  mb.className = 'mic-button';
  sl.textContent = label;
  listening = s === 'listening';
  processing = s === 'processing';
  speaking = s === 'speaking';
  if (s === 'listening') mb.classList.add('active');
  else if (s === 'processing') mb.classList.add('processing');
  else if (s === 'speaking') mb.classList.add('speaking');
}

function escape(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'transcript-box';
  d.innerHTML = '<div class="label">' + (role === 'user' ? 'You' : 'LeadRescuePro') + '</div><div class="text ' + role + '">' + escape(text) + '</div>';
  conv.appendChild(d); conv.scrollTop = conv.scrollHeight;
}

function clearChat() { conv.innerHTML = ''; addMsg('assistant', 'Cleared.'); }

// ===== VOICES =====
function populateVoices() {
  if (typeof speechSynthesis === 'undefined') return;
  voiceList = speechSynthesis.getVoices();
  const cur = vs.value; vs.innerHTML = '<option value="">Auto</option>';
  voiceList.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')'; vs.appendChild(o); });
  vs.value = cur;
}
if (typeof speechSynthesis !== 'undefined') { speechSynthesis.onvoiceschanged = populateVoices; setTimeout(populateVoices, 500); }
vs.addEventListener('change', function() { prefVoice = this.value; });

// ===== SPEAK =====
function speak(text) {
  return new Promise(r => {
    if (!text || !speechSynthesis) { setStatus('idle', 'Tap the mic or type'); r(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 1.0; u.pitch = 1.0;
    if (prefVoice) { const f = voiceList.find(v => v.name === prefVoice); if (f) u.voice = f; }
    setStatus('speaking', 'Speaking...');
    u.onend = () => { setStatus('idle', 'Tap the mic or type'); r(); };
    u.onerror = () => { setStatus('idle', 'Tap the mic or type'); r(); };
    speechSynthesis.speak(u);
  });
}

// ===== BACKEND CHECK (with bypass header) =====
async function checkConn() {
  cs.className = 'status-line checking';
  cs.textContent = '⬤ Checking...';
  const url = (CROSS ? TUNNEL_HOST : '') + '/health?_=' + Date.now();
  try {
    const r = await fetch(url, { headers: apiHeaders() });
    const ct = r.headers.get('content-type') || '';
    if (ct.includes('json')) {
      const d = await r.json();
      if (d && d.status === 'ok') {
        cs.className = 'status-line online';
        cs.textContent = '⬤ Connected';
        return;
      }
    }
    // Captcha page or unexpected response
    throw 'captcha-or-error';
  } catch(e) {
    cs.className = 'status-line offline';
    cs.textContent = '⬤ Backend offline';
    setTimeout(checkConn, 4000);
  }
}

// ===== API CALL (with bypass header + content-type check) =====
async function callAPI(text) {
  setStatus('processing', 'Thinking...');
  const url = (CROSS ? TUNNEL_HOST : '') + '/api/chat?_=' + Date.now();
  const body = JSON.stringify({ message: text, session_id: 'v_' + Date.now() });

  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: apiHeaders(),
        body: body
      });
      // CRITICAL: Check if localtunnel returned its captcha HTML page
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('json')) {
        throw 'localtunnel-captcha';
      }
      if (!r.ok) throw 'HTTP ' + r.status;
      const d = await r.json();
      return d.response;
    } catch(e) {
      const msg = e === 'localtunnel-captcha'
        ? 'LocalTunnel captcha page. Retrying...'
        : 'Retry ' + (i+2) + '/3...';
      if (i < 2) {
        await new Promise(r => setTimeout(r, 2000));
        setStatus('processing', msg);
      }
    }
  }
  cs.className = 'status-line offline';
  cs.textContent = '⬤ Backend offline';
  return "Backend appears offline. Please try the direct tunnel URL: " + TUNNEL_HOST;
}

async function processAndSpeak(text) {
  const resp = await callAPI(text);
  addMsg('assistant', resp);
  if (resp.includes('offline')) {
    cs.className = 'status-line offline';
    cs.textContent = '⬤ Backend offline';
    setTimeout(checkConn, 4000);
  } else {
    cs.className = 'status-line online';
    cs.textContent = '⬤ Connected';
    await speak(resp);
  }
}

// ===== TEXT INPUT =====
function sendText() {
  if (processing || speaking) return;
  const t = ti.value.trim(); if (!t) return;
  ti.value = ''; addMsg('user', t); processAndSpeak(t);
}
ti.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendText(); });

// ===== MIC =====
function toggleMic() {
  if (listening) { stopMic(); }
  else if (!processing && !speaking) { startMic(); }
}
function startMic() {
  if (!hasSpeech) {
    setStatus('error', 'Voice not supported');
    setTimeout(() => setStatus('idle', 'Type instead'), 2000);
    ti.focus(); return;
  }
  try {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recog = new SR();
    recog.continuous = false; recog.interimResults = false; recog.lang = 'en-US';
    recog.onresult = function(e) {
      const t = e.results[0][0].transcript; addMsg('user', t); processAndSpeak(t);
    };
    recog.onerror = function(e) {
      if (e.error === 'not-allowed') setStatus('error', 'Mic blocked');
      else if (e.error === 'no-speech') setStatus('idle', 'Tap mic or type');
      else setStatus('error', e.error);
      setTimeout(() => { if (!processing && !speaking) setStatus('idle', 'Tap mic or type'); }, 2000);
    };
    recog.onend = function() { if (!processing && !speaking) setStatus('idle', 'Tap mic or type'); };
    recog.start(); setStatus('listening', 'Listening...');
  } catch(e) { setStatus('error', 'Mic error'); setTimeout(() => setStatus('idle', 'Type'), 2000); }
}
function stopMic() {
  if (recog) { try { recog.stop(); } catch(e) {} recog = null; }
  if (!processing && !speaking) setStatus('idle', 'Tap mic or type');
}

document.addEventListener('keydown', function(e) {
  if (e.target.tagName !== 'INPUT' && e.code === 'Space') { e.preventDefault(); toggleMic(); }
});
</script>
</body>
</html>
